<div style="background: #0F0E0D; color: #F2ECE1; font-family: Inter, system-ui, sans-serif; min-height: 100vh">
<!--@header-->
<main id="conteudo">
<section class="wrap" style="max-width: 1360px; margin: 0 auto; padding: 96px 40px 32px; box-sizing: border-box">
<p style="margin: 0 0 12px; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #DEAC00; font-weight: 600">Agenda</p>
<h1 style="margin: 0; font-family: 'Sharp Grotesk', Inter, sans-serif; text-transform: uppercase; letter-spacing: 0.01em; font-weight: 900; font-size: clamp(36px, 5.56vw, 80px); line-height: 0.95">Próximos shows</h1>
<p style="margin: 24px 0 0; font-size: 18px; color: #D9D1C4; max-width: 720px; line-height: 1.55">Dois sets por noite, um único ingresso. Área interna dedicada à escuta; área externa, com som ambiente, paga meia.</p>
<div aria-label="Filtrar por estilo" data-filter-group="" data-style-off="min-height: 44px; padding: 0 20px; border-radius: 999px; font-family: inherit; font-size: 14px; cursor: pointer; background: transparent; color: #F2ECE1; border: 1px solid rgba(242,236,225,0.3); font-weight: 500;" data-style-on="min-height: 44px; padding: 0 20px; border-radius: 999px; font-family: inherit; font-size: 14px; cursor: pointer; background: #EFADFF; color: #0F0E0D; border: 1px solid #F2ECE1; font-weight: 600;" role="group" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 48px; padding-bottom: 32px; border-bottom: 1px solid rgba(242,236,225,0.12)">
<button aria-pressed="true" data-filter="todos" style="min-height: 44px; padding: 0 20px; border-radius: 999px; font-family: inherit; font-size: 14px; cursor: pointer; background: #EFADFF; color: #0F0E0D; border: 1px solid #F2ECE1; font-weight: 600;" type="button">Todos</button>
<button aria-pressed="false" data-filter="jazz" style="min-height: 44px; padding: 0 20px; border-radius: 999px; font-family: inherit; font-size: 14px; cursor: pointer; background: transparent; color: #F2ECE1; border: 1px solid rgba(242,236,225,0.3); font-weight: 500;" type="button">Jazz</button>
<button aria-pressed="false" data-filter="instrumental" style="min-height: 44px; padding: 0 20px; border-radius: 999px; font-family: inherit; font-size: 14px; cursor: pointer; background: transparent; color: #F2ECE1; border: 1px solid rgba(242,236,225,0.3); font-weight: 500;" type="button">Instrumental brasileira</button>
<button aria-pressed="false" data-filter="minas" style="min-height: 44px; padding: 0 20px; border-radius: 999px; font-family: inherit; font-size: 14px; cursor: pointer; background: transparent; color: #F2ECE1; border: 1px solid rgba(242,236,225,0.3); font-weight: 500;" type="button">Música de Minas</button>
<button aria-pressed="false" data-filter="vocal" style="min-height: 44px; padding: 0 20px; border-radius: 999px; font-family: inherit; font-size: 14px; cursor: pointer; background: transparent; color: #F2ECE1; border: 1px solid rgba(242,236,225,0.3); font-weight: 500;" type="button">Vocal</button>
<button aria-pressed="false" data-filter="bigband" style="min-height: 44px; padding: 0 20px; border-radius: 999px; font-family: inherit; font-size: 14px; cursor: pointer; background: transparent; color: #F2ECE1; border: 1px solid rgba(242,236,225,0.3); font-weight: 500;" type="button">Big Band</button>
<button aria-pressed="false" data-filter="escola" style="min-height: 44px; padding: 0 20px; border-radius: 999px; font-family: inherit; font-size: 14px; cursor: pointer; background: transparent; color: #F2ECE1; border: 1px solid rgba(242,236,225,0.3); font-weight: 500;" type="button">Escola do Jazz</button>
</div>
</section>
<section class="wrap" style="max-width: 1360px; margin: 0 auto; padding: 0 40px 120px; box-sizing: border-box">
<p data-count="" style="margin: 0 0 8px; font-size: 14px; color: #B9B0A3">{{count_label}}</p><!--@agenda-list-->














<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; margin-top: 48px">
<a data-pendente="arquivo-shows-passados" href="#" style="font-weight: 600; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center">Arquivo de shows passados →</a>
<a href="/ao-vivo/" style="font-weight: 600; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center">Perdeu algum? Assista no Ao vivo →</a>
</div>
</section>
</main>
<!--@footer-->
</div>
