<article class="show">
  <div class="wrap">
    <nav class="show__breadcrumb" aria-label="Localização na agenda"><a href="/agenda/" class="link">Agenda</a></nav>
    <div class="show__grade">
      <div class="show__foto"><img src="{{image}}" alt="{{title_attr}}" width="600" height="510" fetchpriority="high"></div>
      <div class="show__lateral">
        <div>
          <p class="show__quando"><time datetime="{{event_date}}"><span class="sr-only">{{full_date}}</span><span class="num" aria-hidden="true">{{date_short}}</span> <span>{{eyebrow}}</span></time> {{status}}</p>
          <h1 class="t-1 show__titulo">{{title_main}}</h1>
          <!--@title-sub-->
        </div>
        <div class="bilhete" id="ingressos">
          <dl><!--@aside-rows--></dl>
          {{ticket_button}}
          <p class="bilhete__nota"{{ticket_note_hidden}}>{{tickets_note}}</p>
          <p class="acoes"><a class="link" href="{{ics_url}}" download>Adicionar à agenda</a><a class="link" data-share href="{{url}}">Compartilhar</a></p>
        </div>
      </div>
      <div class="show__corpo">
        <section class="show__secao" aria-labelledby="sobre"><h2 class="t-3" id="sobre">Sobre o show</h2>
          <div class="prose"><!--@description--></div>
        </section>
        <!--@formation-->
        <!--@video-->
        <!--@bomsaber-->
      </div>
    </div>
  </div>
</article>
<!--@more-start-->
<section class="secao" aria-labelledby="mais">
  <div class="wrap">
    <div class="cabeca cabeca--lado"><h2 class="t-2" id="mais">Próximos shows</h2><p><a class="link-forte" href="/agenda/">Agenda completa</a></p></div>
    <!--@more-->
  </div>
</section>
<!--@more-end-->
