<article style="display: flex; flex-direction: column; background: #181614; border-radius: 12px; overflow: hidden; border: 1px solid rgba(242,236,225,0.08)">
<img alt="{{title_attr}}" decoding="async" loading="lazy" src="{{image}}" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #2A2622"/>
<div style="padding: 28px; display: flex; flex-direction: column; gap: 10px; flex: 1">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #DEAC00; font-weight: 600">{{day}}</p>
<h3 style="margin: 0; font-family: 'Sharp Grotesk', Inter, sans-serif; text-transform: uppercase; letter-spacing: 0.01em; font-weight: 900; font-size: 21px; line-height: 1.08">{{title_main}}</h3>
<p style="margin: 0; font-size: 15px; color: #EFADFF; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 400">{{sub}}</p>
<p style="margin: 0; font-size: 14px; color: #B9B0A3">{{times_short}}</p>
<div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 16px">
<a href="{{tickets_url}}" rel="noopener" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #DEAC00; color: #0F0E0D; font-weight: 600; font-size: 14px; text-decoration: none" target="_blank">{{tickets_label}}</a>
<a href="{{url}}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(242,236,225,0.35); color: #F2ECE1; font-size: 14px; text-decoration: none">Mais informações</a>
</div>
</div>
</article>
