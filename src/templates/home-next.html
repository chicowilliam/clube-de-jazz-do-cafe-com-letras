<div style="flex: 0 1 400px; background: rgba(15,14,13,0.78); backdrop-filter: blur(8px); border: 1px solid rgba(242,236,225,0.18); border-radius: 12px; padding: 28px; box-sizing: border-box">
<p style="margin: 0; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #CFC6B8; font-weight: 600">{{label}}</p>
<h2 style="margin: 12px 0 4px; font-family: 'Sharp Grotesk', Inter, sans-serif; text-transform: uppercase; letter-spacing: 0.01em; font-weight: 900; font-size: 31px; line-height: 1.05">{{title}}</h2>
<p style="margin: 0; color: #EFADFF; font-size: 17px; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 400">{{sub}}</p>
<p style="margin: 16px 0 24px; color: #D9D1C4; font-size: 15px">{{times}}</p>
<div style="display: flex; gap: 12px; flex-wrap: wrap">
<a href="{{tickets_url}}" rel="noopener" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; background: #DEAC00; color: #0F0E0D; font-weight: 600; font-size: 15px; text-decoration: none" target="_blank">{{tickets_label}}</a>
<a href="{{url}}" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid rgba(242,236,225,0.4); color: #F2ECE1; font-weight: 500; font-size: 15px; text-decoration: none">Sobre o show</a>
</div>
</div>
